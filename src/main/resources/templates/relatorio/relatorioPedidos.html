<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatorio de Pedidos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            --glass-border: rgba(255, 215, 0, 0.16);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            background: linear-gradient(-45deg, #000000, #1a1a1a, #2d2d2d, #000000, #1a1a1a, #FFD700);
            background-size: 600% 600%;
            animation: gradientShift 15s ease infinite;
            padding-top: 96px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #ffffff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            opacity: 0.08;
            pointer-events: none;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            25% { background-position: 100% 50%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
            100% { background-position: 0% 50%; }
        }

        .navbar {
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-header,
        .table-container {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(22px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }

        .page-header {
            padding: 2.25rem;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 800;
            color: #FFD700;
        }

        .btn-custom {
            background: var(--primary-gradient);
            border: none;
            border-radius: 16px;
            padding: 14px 24px;
            font-weight: 700;
            color: #111827;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            border-radius: 16px;
            padding: 12px 22px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .table { margin: 0; }
        .table thead th {
            background: rgba(15, 15, 35, 0.92);
            color: #e5e7eb;
            border: none;
            padding: 18px 16px;
        }

        .table tbody td {
            color: #111827;
            background: rgba(255,255,255,0.92);
            padding: 16px;
            vertical-align: middle;
        }

        .empty-state {
            color: rgba(255,255,255,0.75);
            text-align: center;
            padding: 3rem;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/home}">
            <i class="bi bi-bar-chart-line me-2"></i> Organizacoes Tabajara
        </a>
    </div>
</nav>

<main class="container py-4" style="max-width: 1200px;">
    <section class="page-header">
        <div class="d-flex flex-column flex-md-row gap-3 align-items-md-center justify-content-between">
            <div>
                <h1 class="page-title mb-2">Relatorio de Pedidos</h1>
                <p class="mb-0" style="color: rgba(255,255,255,0.76);">Visualize os pedidos cadastrados e gere o PDF.</p>
            </div>
            <a th:href="@{/relatorios/pedidos/pdf}" class="btn-custom" target="_blank">
                <i class="bi bi-file-earmark-pdf"></i>
                Gerar PDF
            </a>
        </div>
    </section>

    <section class="table-container overflow-hidden">
        <div class="table-responsive" th:if="${!pedidos.isEmpty()}">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Data</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pedido : ${pedidos}">
                        <td th:text="${pedido.idPedido}">1</td>
                        <td th:text="${pedido.usuario != null ? pedido.usuario.nomeUsuario : 'Sem cliente'}">Cliente</td>
                        <td th:text="${pedido.dataPedido != null ? pedido.dataPedido : '-'}">2026-01-01</td>
                        <td th:text="${pedido.valorTotalPedido != null ? 'R$ ' + #numbers.formatDecimal(pedido.valorTotalPedido, 1, 2) : 'R$ 0,00'}">R$ 0,00</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="empty-state" th:if="${pedidos.isEmpty()}">
            <i class="bi bi-inbox fs-1 d-block mb-3"></i>
            Nenhum pedido cadastrado.
        </div>
    </section>

    <div class="text-center mt-4">
        <a th:href="@{/home}" class="btn-back">
            <i class="bi bi-arrow-left"></i>
            Voltar ao painel
        </a>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
