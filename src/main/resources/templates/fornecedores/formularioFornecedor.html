<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fornecedor - Organizacoes Tabajara</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 215, 0, 0.2);
            --input-bg: rgba(15, 23, 42, 0.78);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            background: linear-gradient(-45deg, #000000, #1a1a1a, #2d2d2d, #000000, #1a1a1a, #FFD700);
            background-size: 600% 600%;
            animation: gradientShift 15s ease infinite;
            overflow-x: hidden;
            padding-top: 90px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #ffffff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.75), transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            opacity: 0.08;
            animation: float 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            25% { background-position: 100% 50%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(360deg); }
        }

        .navbar {
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.45rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-link {
            color: rgba(255,255,255,0.78) !important;
            font-weight: 600;
        }

        .nav-link:hover { color: #FFD700 !important; }

        .form-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 32px 20px 70px;
        }

        .form-card {
            background: var(--glass-bg);
            backdrop-filter: blur(28px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 2.5rem;
            box-shadow: 0 30px 80px rgba(0,0,0,0.36);
            position: relative;
            overflow: hidden;
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--primary-gradient);
        }

        .form-icon {
            width: 78px;
            height: 78px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            color: #FFD700;
            font-size: 2.2rem;
            background: rgba(255, 215, 0, 0.14);
            border: 1px solid rgba(255, 215, 0, 0.24);
        }

        .form-title {
            font-size: clamp(2rem, 4vw, 2.7rem);
            font-weight: 800;
            color: #FFD700;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .form-subtitle {
            color: rgba(255,255,255,0.74);
            text-align: center;
            margin-bottom: 2rem;
        }

        label {
            color: rgba(255,255,255,0.84);
            font-weight: 700;
            margin-bottom: 0.45rem;
        }

        .form-control {
            background: var(--input-bg);
            border: 1px solid rgba(255,255,255,0.18);
            color: #ffffff;
            border-radius: 14px;
            padding: 13px 15px;
        }

        .form-control:focus {
            background: rgba(15, 23, 42, 0.92);
            border-color: rgba(255, 215, 0, 0.68);
            box-shadow: 0 0 0 0.2rem rgba(255, 215, 0, 0.18);
            color: #ffffff;
        }

        .form-control::placeholder { color: rgba(255,255,255,0.48); }

        .btn-save,
        .btn-back {
            border-radius: 16px;
            padding: 14px 20px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            width: 100%;
        }

        .btn-save {
            background: var(--primary-gradient);
            border: none;
            color: #111827;
        }

        .btn-back {
            border: 1px solid rgba(255,255,255,0.2);
            color: #ffffff;
            background: rgba(255,255,255,0.1);
        }

        .btn-back:hover {
            color: #ffffff;
            background: rgba(255,255,255,0.18);
        }

        @media (max-width: 576px) {
            .form-card { padding: 1.5rem; border-radius: 22px; }
            body { padding-top: 78px; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/home}">
            <i class="bi bi-truck me-2"></i> Organizacoes Tabajara
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#fornecedorFormNav" aria-controls="fornecedorFormNav" aria-expanded="false" aria-label="Abrir navegacao">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="fornecedorFormNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/home}">Painel</a>
                <a class="nav-link" th:href="@{/fornecedores/listar}">Fornecedores</a>
                <a class="nav-link" th:href="@{/produtos/listar}">Produtos</a>
            </div>
        </div>
    </div>
</nav>

<main class="form-container">
    <section class="form-card">
        <div class="form-icon">
            <i class="bi" th:classappend="${fornecedor.idFornecedor != null} ? ' bi-pencil-square' : ' bi-plus-circle'"></i>
        </div>
        <h1 class="form-title" th:text="${fornecedor.idFornecedor != null} ? 'Editar Fornecedor' : 'Novo Fornecedor'">Novo Fornecedor</h1>
        <p class="form-subtitle">Preencha os dados do fornecedor para manter o cadastro atualizado.</p>

        <form th:action="@{/fornecedores/salvar}" method="POST" th:object="${fornecedor}">
            <input type="hidden" th:field="*{idFornecedor}" />

            <div class="row g-3">
                <div class="col-12">
                    <label for="nomeFornecedor">Nome</label>
                    <input id="nomeFornecedor" type="text" class="form-control" th:field="*{nomeFornecedor}" placeholder="Digite o nome do fornecedor" required>
                </div>

                <div class="col-md-6">
                    <label for="cnpjFornecedor">CNPJ</label>
                    <input id="cnpjFornecedor" type="text" class="form-control" th:field="*{cnpjFornecedor}" placeholder="Digite o CNPJ" required>
                </div>

                <div class="col-md-6">
                    <label for="telefoneFornecedor">Telefone</label>
                    <input id="telefoneFornecedor" type="text" class="form-control" th:field="*{telefoneFornecedor}" placeholder="Digite o telefone" required>
                </div>

                <div class="col-md-7">
                    <label for="enderecoFornecedor">Endereco</label>
                    <input id="enderecoFornecedor" type="text" class="form-control" th:field="*{enderecoFornecedor}" placeholder="Digite o endereco" required>
                </div>

                <div class="col-md-5">
                    <label for="cidadeFornecedor">Cidade</label>
                    <input id="cidadeFornecedor" type="text" class="form-control" th:field="*{cidadeFornecedor}" placeholder="Digite a cidade" required>
                </div>
            </div>

            <div class="row g-3 mt-4">
                <div class="col-md-6">
                    <a th:href="@{/fornecedores/listar}" class="btn-back">
                        <i class="bi bi-arrow-left"></i>
                        Voltar
                    </a>
                </div>
                <div class="col-md-6">
                    <button type="submit" class="btn btn-save">
                        <i class="bi bi-check-circle"></i>
                        Salvar
                    </button>
                </div>
            </div>
        </form>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
